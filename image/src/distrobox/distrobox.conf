# BrescaOS's Distrobox settings (README.md). Distrobox reads this file after
# /usr/share/distrobox/distrobox.conf (the default image, from
# image/build/system.sh) and before /etc/distrobox/distrobox.conf and the
# user's, which can override it. Every distrobox command sources it with
# /bin/sh, with that command's arguments in "$@".
case ${0##*/} in
    distrobox-create)
        # The colors and prompt, sourced after Distrobox's own profile.
        container_additional_volumes="/usr/libexec/bresca/distrobox/profile.sh:/etc/profile.d/zz-brescaos-distrobox.sh:ro"
        ;;
    distrobox-enter)
        # The colors of the distrobox it enters, for profile.sh.
        container_manager_additional_flags=$(/usr/libexec/bresca/distrobox/bresca-distrobox-colors "$@")
        ;;
esac
