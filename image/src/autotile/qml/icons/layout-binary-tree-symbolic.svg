<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
    <style type="text/css" id="current-color-scheme">
        .ColorScheme-Text {
            color:#232629;
        }
    </style>
    <g class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-linejoin="round">
        <!-- Each split smaller than the last: what tells it from a master layout's even stack. -->
        <rect x="2.5" y="2.5" width="6" height="17" rx="1.5"/>
        <rect x="11.5" y="2.5" width="8" height="7" rx="1.5"/>
        <rect x="11.5" y="12.5" width="3" height="7" rx="1"/>
        <rect x="16.5" y="12.5" width="3" height="7" rx="1"/>
    </g>
</svg>
