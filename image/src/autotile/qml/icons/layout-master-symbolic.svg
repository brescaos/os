<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
    <style type="text/css" id="current-color-scheme">
        .ColorScheme-Text {
            color:#232629;
        }
    </style>
    <g class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-linejoin="round">
        <!-- One big window and an even stack. -->
        <rect x="2.5" y="2.5" width="9" height="16" rx="1.5"/>
        <rect x="14.5" y="2.5" width="5" height="4" rx="1"/>
        <rect x="14.5" y="8.5" width="5" height="4" rx="1"/>
        <rect x="14.5" y="14.5" width="5" height="4" rx="1"/>
    </g>
</svg>
