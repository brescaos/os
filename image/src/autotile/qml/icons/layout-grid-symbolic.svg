<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
    <style type="text/css" id="current-color-scheme">
        .ColorScheme-Text {
            color:#232629;
        }
    </style>
    <g class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-linejoin="round">
        <!-- All of a size. -->
        <rect x="2.5" y="2.5" width="7" height="7" rx="1.5"/>
        <rect x="12.5" y="2.5" width="7" height="7" rx="1.5"/>
        <rect x="2.5" y="12.5" width="7" height="7" rx="1.5"/>
        <rect x="12.5" y="12.5" width="7" height="7" rx="1.5"/>
    </g>
</svg>
