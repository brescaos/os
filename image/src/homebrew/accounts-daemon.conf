# AccountsService (System Settings > Users) runs userdel in a service that
# sees everything it doesn't list as read-only (ProtectSystem=strict). With
# /var/opt listed, userdel's USERDEL_CMD can remove the deleted user's
# Homebrew (/var/opt/<uid>). "-": no error if it's missing.
[Service]
ReadWritePaths=-/var/opt
